<!doctype html>
<html lang="en" th:lang="${language ?: 'en'}" xmlns:th="http://www.thymeleaf.org">
<body th:attr="data-site-base=${siteBasePath},data-api-base=${apiBasePath},data-language=${language},data-conference-seq=${conferenceSeq}">
	<div class="notice" th:fragment="content">
		<div class="container">
			<table class="w-100 bdtable mb5 aos-init aos-animate"
				data-aos="fade-up">
				<colgroup>
					<col class="d-none d-lg-table-column" style="width: 8%;">
					<col style="width: auto;">
					<col class="d-none d-lg-table-column" style="width: 15%;">
					<col class="d-none d-lg-table-column" style="width: 10%;">
					<col class="d-none d-lg-table-column" style="width: 10%;">
				</colgroup>
				<tbody>
					<tr th:each="notice, noticeStat : ${noticePage.items}" th:with="noticeDate=${notice.publishedAt != null ? notice.publishedAt : notice.createdAt}" th:classappend="${notice.isPinned ? 'pinned' : ''}">
						<td class="text-center d-none d-lg-table-cell">
							<img th:if="${notice.isPinned}" src="/public/img/information/pinned.png">
							<span th:unless="${notice.isPinned}"
								  th:text="${noticePage.totalCount - ((noticePage.page - 1) * noticePage.size) - noticeStat.index}">
							</span>
						</td>
						<td class="title"><a th:href="${siteContext.pageUrl('/notice-detail?seq=' + notice.seq)}" th:text="${notice.title}">Notice title</a>
							<ul class="bdt-info un-style d-block d-lg-none">
								<li th:text="${(language == 'ko' ? '등록일 : ' : 'Date : ') + #temporals.format(noticeDate, 'yyyy-MM-dd')}">Date : 2026-08-28</li>
							</ul></td>

						<td class="text-center d-none d-lg-table-cell">
							<img th:if="${notice.attachmentCount > 0}" src="/public/img/information/file.png">
						</td>
						<td class="text-center d-none d-lg-table-cell" th:text="${notice.createdByName}">administration</td>
						<td class="text-center d-none d-lg-table-cell" th:text="${#temporals.format(noticeDate, 'yyyy-MM-dd')}">2026-08-28</td>

					</tr>
					<tr th:if="${#lists.isEmpty(noticePage.items)}">
						<td class="text-center" colspan="5"><th:block th:text="#{public.ui.no.notices.have.been.posted.875e68}">No notices have been posted.</th:block></td>
					</tr>
				</tbody>
			</table>
			<nav class="pagination d-flex justify-content-center" aria-label="Notice pagination" th:aria-label="#{public.ui.notice.pagination.05b164}" th:if="${noticePage.totalPages > 1}">
				<ul class="un-style d-flex align-items-center">
					<li class="pg-arw" th:classappend="${noticePage.page == 1 ? ' d-none' : ''}">
						<a th:if="${noticePage.page > 1}" th:href="@{${siteContext.pageUrl('/notice')}(page=1)}" aria-label="First page" th:aria-label="#{public.ui.first.page.49d74b}"><img src="/public/img/nav-first.svg"></a>
					</li>
					<li class="pg-arw" th:classappend="${noticePage.page == 1 ? ' d-none' : ''}">
						<a th:if="${noticePage.page > 1}" th:href="@{${siteContext.pageUrl('/notice')}(page=${noticePage.page - 1})}" aria-label="Previous page" th:aria-label="#{public.ui.previous.page.81f547}"><img src="/public/img/nav-prev.svg"></a>
					</li>
					<li th:each="pageNum : ${#numbers.sequence(1, noticePage.totalPages)}" th:classappend="${pageNum == noticePage.page ? ' active' : ''}">
						<a th:href="@{${siteContext.pageUrl('/notice')}(page=${pageNum})}" th:text="${pageNum}">1</a>
					</li>
					<li class="pg-arw" th:classappend="${noticePage.page == noticePage.totalPages ? ' d-none' : ''}">
						<a th:if="${noticePage.page < noticePage.totalPages}" th:href="@{${siteContext.pageUrl('/notice')}(page=${noticePage.page + 1})}" aria-label="Next page" th:aria-label="#{public.ui.next.page.4bfc19}"><img src="/public/img/nav-next.svg"></a>
					</li>
					<li class="pg-arw" th:classappend="${noticePage.page == noticePage.totalPages ? ' d-none' : ''}">
						<a th:if="${noticePage.page < noticePage.totalPages}" th:href="@{${siteContext.pageUrl('/notice')}(page=${noticePage.totalPages})}" aria-label="Last page" th:aria-label="#{public.ui.last.page.b01f16}"><img src="/public/img/nav-last.svg"></a>
					</li>
				</ul>
			</nav>
		</div>
	</div>
</body>
</html>
