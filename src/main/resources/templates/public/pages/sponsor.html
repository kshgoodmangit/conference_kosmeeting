<!doctype html>
<html lang="en" th:lang="${language ?: 'en'}" xmlns:th="http://www.thymeleaf.org">
<body th:attr="data-site-base=${siteBasePath},data-api-base=${apiBasePath},data-language=${language},data-conference-seq=${conferenceSeq}">
<div class="sponsorship-section" th:fragment="content">
    <div class="container">
        <div class="sponsor-groups">
            <div class="sponsor-group mb9" th:each="type : ${sponsorTypes}">
                <h4 class="cm-title fnsb mb-5" th:text="${type.codeName}">SPONSOR</h4>
                <div class="sponsor-grid grid-item-3">
                    <a th:each="sponsor : ${sponsors}"
                       th:if="${sponsor.sponsorTypeCode == type.seq}"
                       th:href="${sponsor.linkUrl}"
                       th:attr="aria-label=${sponsor.sponsorName}"
                       target="_blank"
                       rel="noopener noreferrer">
                        <img th:src="${siteContext.apiUrl(sponsor.logoUrl)}" th:alt="${sponsor.sponsorName}">
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
