<!doctype html>
<html lang="en" th:lang="${language ?: 'en'}" xmlns:th="http://www.thymeleaf.org">
<body th:attr="data-site-base=${siteBasePath},data-api-base=${apiBasePath},data-language=${language},data-conference-seq=${conferenceSeq}">
    <div class="member-login-page member-recovery-page" th:fragment="content">
        <style>
            .page-top {
                background-image: url('/public/img/member/login-top.png');
                background-position: top right;
                background-repeat: no-repeat;
            }
            #content {
                background-image: url('/public/img/member/login-bottom.png');
                background-position: bottom left;
                background-repeat: no-repeat;
            }
        </style>

        <div class="member-login-shell container">
            <form id="member-recovery-form" class="member-login-card" action="/api/public/members/password-reset/request" th:action="${siteContext != null ? siteContext.apiUrl('/api/public/members/password-reset/request') : '/api/public/members/password-reset/request'}" method="post" aria-labelledby="recovery-title">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" data-reset-csrf>
                <h2 id="recovery-title"><th:block th:text="#{public.ui.forgot.password.f99d98}">Forgot Password</th:block></h2>
                <div class="member-login-fields member-recovery-fields">
                    <p class="member-recovery-description"><th:block th:text="#{public.ui.enter.the.email.address.you.used.4eb322}">Enter the email address you used to sign up to request a password reset link.</th:block></p>
                    <label for="recovery-email"><th:block th:text="#{public.ui.id.e.mail.a2609e}">ID (E-mail)</th:block></label>
                    <input id="recovery-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="255" placeholder="Enter your registered email address" th:placeholder="#{public.ui.enter.your.registered.email.address.808148}" aria-describedby="recovery-email-hint" required>
                    <p id="recovery-email-hint" class="member-recovery-hint"><th:block th:text="#{public.ui.please.use.the.same.email.address.e357c5}">Please use the same email address as your login ID.</th:block></p>
                    <button type="submit" disabled><th:block th:text="#{public.ui.send.reset.link.987be4}">Send Reset Link</th:block></button>
                    <p id="recovery-status" class="member-recovery-status" role="status" aria-live="polite" tabindex="-1" hidden></p>
                    <noscript><p class="member-recovery-hint"><th:block th:text="#{public.ui.please.enable.javascript.to.use.this.657783}">Please enable JavaScript to use this form.</th:block></p></noscript>
                </div>
                <div class="member-login-join">
                    <p><th:block th:text="#{public.ui.remember.your.password.0eb277}">Remember your password?</th:block></p>
                    <a href="/login" th:href="${siteContext != null ? siteContext.pageUrl(loginMenu != null ? loginMenu.routePath : '/login') : (loginMenu != null ? loginMenu.routePath : '/login')}"><th:block th:text="#{public.ui.back.to.login.b5cd32}">Back to Login</th:block></a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
