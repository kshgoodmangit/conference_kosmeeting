<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="member-login-page member-recovery-page" th:fragment="content">
        <style>
            .page-top {
                background-image: url('/public/img/member/login-top.png');
                background-position: top right;
                background-repeat: no-repeat;
            }
            #content {
                background-image: url('/public/img/member/login-bottom.png');
                background-position: bottom left;
                background-repeat: no-repeat;
            }
        </style>

        <div class="member-login-shell container">
            <form id="member-recovery-form" class="member-login-card" action="/api/public/members/password-reset/request" method="post" aria-labelledby="recovery-title">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" data-reset-csrf>
                <h2 id="recovery-title">Forgot Password</h2>
                <div class="member-login-fields member-recovery-fields">
                    <p class="member-recovery-description">Enter the email address you used to sign up to request a password reset link.</p>
                    <label for="recovery-email">ID (E-mail)</label>
                    <input id="recovery-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="255" placeholder="Enter your registered email address" aria-describedby="recovery-email-hint" required>
                    <p id="recovery-email-hint" class="member-recovery-hint">Please use the same email address as your login ID.</p>
                    <button type="submit" disabled>Send Reset Link</button>
                    <p id="recovery-status" class="member-recovery-status" role="status" aria-live="polite" tabindex="-1" hidden></p>
                    <noscript><p class="member-recovery-hint">Please enable JavaScript to use this form.</p></noscript>
                </div>
                <div class="member-login-join">
                    <p>Remember your password?</p>
                    <a href="/login" th:href="${loginMenu != null ? loginMenu.routePath : '/login'}">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
