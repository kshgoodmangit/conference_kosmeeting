<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
	<div class="member-login-page" th:fragment="content">
        <style>
            .page-top {
                background-image: url('/public/img/member/login-top.png');
                background-position: top right; background-repeat: no-repeat;
            }
            #content {
                background-image: url('/public/img/member/login-bottom.png');
                background-position: bottom left; background-repeat: no-repeat;
            }
        </style>

        <div class="member-login-shell container">
            <div class="member-login-art member-login-art-top" aria-hidden="true"></div>
            <form id="member-login-form" class="member-login-card" action="/api/public/members/login" method="post" novalidate data-success-url="/">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <h2>Login</h2>
                <p class="member-recovery-status" data-password-login-notice role="status" hidden></p>
                <div class="member-login-fields">
                    <label for="login-email" class="sr-only">ID (E-mail)</label>
                    <input id="login-email" type="email" name="email" autocomplete="email" placeholder="ID (E-mail)" required>

                    <label for="login-password" class="sr-only">Password</label>
                    <input id="login-password" type="password" name="password" autocomplete="current-password" placeholder="Password" required>

                    <button type="submit">LOGIN</button>
                    <a class="member-login-recovery" href="/forgot-password">Forgot your password?</a>
                </div>
                <div class="member-login-join">
                    <p>Please log in with your ID and password. First time here?</p>
                    <a href="/join" th:href="${joinMenu != null ? joinMenu.routePath : '/join'}">Sign Up</a>
                </div>
            </form>
            <div class="member-login-art member-login-art-bottom" aria-hidden="true"></div>
        </div>
	</div>
</body>
</html>
