<!doctype html>
<html lang="en" th:lang="${language ?: 'en'}" xmlns:th="http://www.thymeleaf.org">
<body th:attr="data-site-base=${siteBasePath},data-api-base=${apiBasePath},data-language=${language},data-conference-seq=${conferenceSeq}">
    <div class="member-login-page member-recovery-page" th:fragment="content">
        <style>
            .page-top {
                background-image: url('/public/img/member/login-top.png');
                background-position: top right;
                background-repeat: no-repeat;
            }
            #content {
                background-image: url('/public/img/member/login-bottom.png');
                background-position: bottom left;
                background-repeat: no-repeat;
            }
        </style>
        <div class="member-login-shell container">
            <form id="member-reset-form" class="member-login-card" action="/api/public/members/password-reset/confirm" th:action="${siteContext != null ? siteContext.apiUrl('/api/public/members/password-reset/confirm') : '/api/public/members/password-reset/confirm'}" method="post" aria-labelledby="reset-title">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" data-reset-csrf>
                <h2 id="reset-title"><th:block th:text="#{public.ui.reset.password.3fb75e}">Reset Password</th:block></h2>
                <div class="member-login-fields member-recovery-fields">
                    <p id="reset-status" class="member-recovery-status" role="status" aria-live="polite" tabindex="-1"><th:block th:text="#{public.ui.checking.your.reset.link.66820f}">Checking your reset link...</th:block></p>
                    <fieldset id="reset-fields" class="member-reset-fields" disabled hidden>
                        <legend class="sr-only"><th:block th:text="#{public.ui.choose.a.new.password.3f657f}">Choose a new password</th:block></legend>
                        <p class="member-recovery-description"><th:block th:text="#{public.ui.choose.a.new.password.for.your.629667}">Choose a new password for your account.</th:block></p>
                        <label for="reset-password"><th:block th:text="#{public.ui.new.password.4894cb}">New Password</th:block></label>
                        <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="16" aria-describedby="reset-password-hint" required>
                        <p id="reset-password-hint" class="member-recovery-hint"><th:block th:text="#{public.ui.use.8.16.characters.do.not.6d1ef9}">Use 8-16 characters. Do not add spaces at the beginning or end.</th:block></p>
                        <label for="reset-password-confirm"><th:block th:text="#{public.ui.confirm.new.password.68dcd7}">Confirm New Password</th:block></label>
                        <input id="reset-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="16" required>
                        <button type="submit"><th:block th:text="#{public.ui.save.new.password.e00c9d}">Save New Password</th:block></button>
                    </fieldset>
                    <a id="reset-request-again" class="member-login-recovery" href="/forgot-password" th:href="${siteContext != null ? siteContext.pageUrl('/forgot-password') : '/forgot-password'}" hidden><th:block th:text="#{public.ui.request.a.new.reset.link.485749}">Request a new reset link</th:block></a>
                    <noscript><p class="member-recovery-hint"><th:block th:text="#{public.ui.please.enable.javascript.and.reopen.the.18df73}">Please enable JavaScript and reopen the link in your email.</th:block></p></noscript>
                </div>
                <div class="member-login-join">
                    <p><th:block th:text="#{public.ui.return.to.your.account.351ced}">Return to your account</th:block></p>
                    <a href="/login" th:href="${siteContext != null ? siteContext.pageUrl(loginMenu != null ? loginMenu.routePath : '/login') : (loginMenu != null ? loginMenu.routePath : '/login')}"><th:block th:text="#{public.ui.back.to.login.b5cd32}">Back to Login</th:block></a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
