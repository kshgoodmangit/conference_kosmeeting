<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="member-login-page member-recovery-page" th:fragment="content">
        <style>
            .page-top {
                background-image: url('/public/img/member/login-top.png');
                background-position: top right;
                background-repeat: no-repeat;
            }
            #content {
                background-image: url('/public/img/member/login-bottom.png');
                background-position: bottom left;
                background-repeat: no-repeat;
            }
        </style>
        <div class="member-login-shell container">
            <form id="member-reset-form" class="member-login-card" action="/api/public/members/password-reset/confirm" method="post" aria-labelledby="reset-title">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" data-reset-csrf>
                <h2 id="reset-title">Reset Password</h2>
                <div class="member-login-fields member-recovery-fields">
                    <p id="reset-status" class="member-recovery-status" role="status" aria-live="polite" tabindex="-1">Checking your reset link...</p>
                    <fieldset id="reset-fields" class="member-reset-fields" disabled hidden>
                        <legend class="sr-only">Choose a new password</legend>
                        <p class="member-recovery-description">Choose a new password for your account.</p>
                        <label for="reset-password">New Password</label>
                        <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="16" aria-describedby="reset-password-hint" required>
                        <p id="reset-password-hint" class="member-recovery-hint">Use 8-16 characters. Do not add spaces at the beginning or end.</p>
                        <label for="reset-password-confirm">Confirm New Password</label>
                        <input id="reset-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="16" required>
                        <button type="submit">Save New Password</button>
                    </fieldset>
                    <a id="reset-request-again" class="member-login-recovery" href="/forgot-password" hidden>Request a new reset link</a>
                    <noscript><p class="member-recovery-hint">Please enable JavaScript and reopen the link in your email.</p></noscript>
                </div>
                <div class="member-login-join">
                    <p>Return to your account</p>
                    <a href="/login" th:href="${loginMenu != null ? loginMenu.routePath : '/login'}">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
