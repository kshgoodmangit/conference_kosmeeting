<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="display">
    <link rel="stylesheet" href="/public/css/popups.css">
    <section th:fragment="panel" th:if="${popupDisplay != null}" id="conference-popups" class="conference-popups" hidden
             th:attr="data-layout=${popupDisplay.layoutNo},data-count=${popupDisplay.items.size()}">
        <div class="conference-popups-backdrop" aria-hidden="true"></div>
        <div class="conference-popups-panel" role="dialog" aria-label="Notices" tabindex="-1">
            <header class="conference-popups-header">
                <button type="button" class="conference-popups-hide" data-popup-hide>Do not show again today</button>
                <button type="button" class="conference-popups-icon" data-popup-close aria-label="Close popup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
                        <path d="M18 6 6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </header>
            <div class="conference-popups-stage">
                <article class="conference-popup-card" th:each="popup, stat : ${popupDisplay.items}"
                         th:attr="data-popup-index=${stat.index},aria-label=${'Notice ' + stat.count}">
                    <div class="conference-popup-content">
                        <div class="conference-popup-html" th:if="${!#strings.isEmpty(popup.contentHtml)}"
                             th:utext="${popup.contentHtml}"></div>
                        <img class="conference-popup-image" th:if="${popup.imageUrl != null}"
                             th:src="${popup.imageUrl}" th:alt="${popup.title}" loading="lazy">
                        <a class="conference-popup-details" th:if="${popup.linkUrl != null}"
                           th:href="${popup.linkUrl}" target="_blank" rel="noopener noreferrer">View details <span aria-hidden="true">↗</span></a>
                    </div>
                </article>
            </div>
            <div class="conference-popups-controls" th:if="${popupDisplay.items.size() > 1}">
                <button type="button" class="conference-popups-icon" data-popup-prev aria-label="Previous update">&#8592;</button>
                <span class="conference-popups-counter" aria-live="off"><span data-popup-current>1</span> / <span th:text="${popupDisplay.items.size()}">1</span></span>
                <button type="button" class="conference-popups-icon" data-popup-next aria-label="Next update">&#8594;</button>
                <button type="button" class="conference-popups-pause" data-popup-pause th:if="${popupDisplay.layoutNo != 4}" aria-pressed="false">Pause</button>
            </div>
            <p class="conference-popups-error" data-popup-error role="alert" hidden></p>
        </div>
    </section>
    <script src="/public/js/popups.js" defer></script>
</th:block>
</body>
</html>
