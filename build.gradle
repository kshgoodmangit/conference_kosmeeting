plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.bjworld21'
version = '0.0.1-SNAPSHOT'
description = 'bjworld21_cms_congress'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

springBoot {
    mainClass = 'com.bjworld21.congress.Bjworld21CmsConferenceApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.maxmind.db:maxmind-db:3.1.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

/* ==========================================================================
   React Frontend 자동 빌드 파이프라인 (Vite 기준)
   ========================================================================== */
node {
    download = true
    version = '24.14.0'
    nodeProjectDir = file("${projectDir}/frontend")
}

// tasks.register를 사용하여 lazy하게 작업 등록 (빌드 속도 최적화)
def npmInstallTask = tasks.register('npmInstallTask', NpmTask) {
    args = ['install']
}

def npmBuildTask = tasks.register('npmBuildTask', NpmTask) {
    args = ['run', 'build']
    dependsOn npmInstallTask
}

// src/main/resources/static에는 과거 프론트엔드 빌드 산출물이 남아 있을 수 있으므로
// 서버에서 직접 사용하는 public 자원만 processResources 입력으로 유지합니다.
sourceSets {
    main {
        resources {
            exclude 'static/**'
        }
    }
}

tasks.named('processResources') {
    dependsOn npmBuildTask

    // 이전 빌드의 해시 JS/CSS가 build/resources에 누적되지 않도록 정리합니다.
    doFirst {
        delete layout.buildDirectory.dir('resources/main/static')
    }

    // Thymeleaf 공개 페이지에서 사용하는 기존 정적 자원입니다.
    from("${projectDir}/src/main/resources/static/public") {
        into 'static/public'
    }

    // Vite가 생성한 최신 React 프론트엔드를 최종 JAR 정적 자원으로 포함합니다.
    from("${projectDir}/frontend/dist") {
        into 'static'
    }
}
